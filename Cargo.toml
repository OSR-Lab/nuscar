[package]
name = "nuscar"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "nuscar_rust"
crate-type = ["cdylib"]

[dependencies]
thiserror = "1.0.30"
ndarray-npy = { version = "0.8.1", default-features = false }
rayon = "1.5.2"
numpy = "0.22.0"
ndarray = { version = "0.15.4", features = ["approx", "rayon", "matrixmultiply-threading"] }
pyo3 = { version = "0.22.0", features = ["extension-module", "abi3-py312"] }
iir_filters = "0.1.2"
ndarray-conv = "0.2.0"
ndarray-stats = "0.5.1"
num_enum = "0.6.1"
num-traits = "0.2"
hex = "0.4.3"
byteorder = "1.4.3"
